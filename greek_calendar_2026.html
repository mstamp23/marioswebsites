<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ελληνικό Εορτολόγιο & Ημερολόγιο 2026</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background: #101020; 
            color: #f0f0f5; 
            padding: 20px 15px; 
        }
        .container { max-width: 1400px; margin: 0 auto; }
        
        /* Επικεφαλίδα σελίδας */
        .page-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .page-header h1 {
            font-size: 1.8em;
            color: #ffd700;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }
        .page-header p {
            color: #8c8ca1;
            font-size: 0.9em;
        }

        /* Grid Μηνών */
        .months-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }
        
        .month { 
            background: #18182d; 
            border-radius: 14px; 
            padding: 15px; 
            border: 1px solid #2a2a48; 
            display: flex; 
            flex-direction: column;
            scroll-margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
            transition: border 0.3s ease;
        }
        
        .month.current-month-box {
            border: 2px solid #4ecdc4;
            box-shadow: 0 0 16px rgba(78, 205, 196, 0.2);
        }
        
        .month-header { 
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700; 
            font-size: 1.15em; 
            margin-bottom: 12px; 
            color: #ffd700; 
            border-bottom: 1px solid #2a2a48;
            padding-bottom: 6px;
        }
        .current-badge {
            background: #4ecdc4;
            color: #101020;
            font-size: 0.65em;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Πλέγμα Ημερών */
        .days-grid { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            gap: 3px; 
            margin-bottom: 12px; 
        }
        .day-header { 
            font-size: 0.78em; 
            font-weight: 600;
            text-align: center; 
            color: #7a7a96; 
            padding-bottom: 4px; 
        }
        .day { 
            aspect-ratio: 1; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            font-size: 0.86em; 
            border-radius: 6px; 
            background: #23233c; 
            cursor: pointer;
            position: relative;
            user-select: none;
            transition: all 0.15s ease;
        }
        .day:hover {
            transform: scale(1.06);
            background: #343456;
            z-index: 2;
        }
        .day.selected {
            outline: 2px solid #4ecdc4;
            background: #313158;
        }
        .day.today { 
            background: #ffd700 !important; 
            color: #101020 !important; 
            font-weight: 800; 
            border: 2px solid #ffffff; 
        }
        .day.holiday-bg { 
            background: #ff5252; 
            color: white; 
            font-weight: 700; 
        }
        .day.sunday { 
            color: #ff8a8a; 
        }
        .day.has-nameday::after {
            content: '';
            width: 4px;
            height: 4px;
            background: #4ecdc4;
            border-radius: 50%;
            position: absolute;
            bottom: 2px;
        }
        .day.today.has-nameday::after {
            background: #101020;
        }
        .empty { 
            background: transparent; 
            cursor: default; 
        }
        .empty:hover {
            transform: none;
            background: transparent;
        }

        /* Πλαίσιο Εορταζόντων Μήνα */
        .month-info-banner {
            margin-top: auto;
            background: rgba(78, 205, 196, 0.08);
            border-left: 3px solid #4ecdc4;
            padding: 8px 10px;
            border-radius: 4px;
            font-size: 0.82em;
            color: #e0e0e0;
            line-height: 1.4;
            min-height: 46px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-bottom: 6px;
        }
        .info-title {
            color: #4ecdc4;
            font-weight: 600;
            margin-bottom: 2px;
            font-size: 0.9em;
        }
        .info-names {
            color: #ffffff;
            font-weight: 500;
            word-break: break-word;
        }
        .info-none {
            color: #7a7a96;
            font-style: italic;
        }
        .info-holiday-pill {
            display: inline-block;
            background: #ff5252;
            color: #fff;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 0.85em;
            margin-right: 5px;
            font-weight: bold;
        }

        /* Banner Αργιών */
        .month-holiday-banner {
            background: rgba(255, 107, 107, 0.1);
            border-left: 3px solid #ff6b6b;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.78em;
            color: #ff9e9e;
        }
        .holiday-item { margin: 1px 0; font-weight: 500; }
    </style>
</head>

        '12-18': 'Σεβαστιανός, Φλώρος, Φλώρα',
        '12-19': 'Αγλαΐα, Άρης',
        '12-20': 'Ιγνάτιος, Ιωσήφ, Σήφης',
        '12-21': 'Θεμιστοκλής, Θέμης, Ιουλία, Ιουλιανή, Γιούλη, Τζούλια',
        '12-22': 'Αναστασία, Νατάσα, Τασία, Σία',
        '12-23': 'Νήφων',
        '12-24': 'Ευγενία, Τζένη',
        '12-25': 'Χρήστος, Χρίστος, Χριστίνα, Χριστιάνα, Εμμανουήλ, Μανώλης, Μανουέλα, Χρύσα, Χρυσή',
        '12-26': 'Εμμανουήλ, Μανώλης, Μανώλα, Κωνστάντιος, Κωνσταντία',
        '12-27': 'Στέφανος, Στεφανία, Στέφη, Μαυρίκιος',
        '12-28': 'Θεόφιλος, Θεοφίλη, Δόμνα',
        '12-29': 'Βενιαμίν',
        '12-30': 'Ανυσία, Γεδεών',
        '12-31': 'Μελανία, Μέλανη'
    };

    const monthNames = ['Ιανουάριος', 'Φεβρουάριος', 'Μάρτιος', 'Απρίλιος', 'Μάιος', 'Ιούνιος', 'Ιούλιος', 'Αύγουστος', 'Σεπτέμβριος', 'Οκτώβριος', 'Νοέμβριος', 'Δεκέμβριος'];
    const dayNames = ['Δε', 'Τρ', 'Τε', 'Πε', 'Πα', 'Σα', 'Κυ'];
    const dayNamesFull = ['Κυριακή', 'Δευτέρα', 'Τρίτη', 'Τετάρτη', 'Πέμπτη', 'Παρασκευή', 'Σάββατο'];

    const revertTimers = {};

    function renderMonthNameday(m, day, isDefault = false) {
        const infoDiv = document.getElementById(`nameday-box-${m}`);
        if (!infoDiv) return;

        const today = new Date();
        const isCurrentMonth = (today.getFullYear() === 2026 && today.getMonth() === m);
        const isToday = isCurrentMonth && (today.getDate() === day);

        if (!day) {
            infoDiv.innerHTML = `<span class="info-none">Κάντε κλικ σε μια ημέρα για να δείτε εορτάζοντες</span>`;
            return;
        }

        const dKey = `${m + 1}-${day}`;
        const name = namedays[dKey];
        const holiday = holidays[dKey];
        const dateObj = new Date(2026, m, day);
        const dayName = dayNamesFull[dateObj.getDay()];

        let titleText = isToday 
            ? `✨ Σήμερα, ${dayName} ${day} ${monthNames[m]}` 
            : `📅 ${dayName} ${day} ${monthNames[m]}`;

        let html = `<div class="info-title">${titleText}:</div><div class="info-names">`;
        
        if (holiday) {
            html += `<span class="info-holiday-pill">🚩 ${holiday}</span>`;
        }
        if (name) {
            html += `🎉 ${name}`;
        } else if (!holiday) {
            html += `<span class="info-none">Δεν υπάρχει κάποια γνωστή γιορτή</span>`;
        }
        html += `</div>`;

        infoDiv.innerHTML = html;

        // Αν έγινε κλικ από τον χρήστη (όχι αυτόματο render), ενεργοποιούμε χρονόμετρο επιστροφής
        if (!isDefault) {
            if (revertTimers[m]) clearTimeout(revertTimers[m]);
            
            revertTimers[m] = setTimeout(() => {
                const monthEl = document.getElementById(`month-${m}`);
                if (monthEl) {
                    monthEl.querySelectorAll('.day.selected').forEach(el => el.classList.remove('selected'));
                }
                if (isCurrentMonth) {
                    renderMonthNameday(m, today.getDate(), true);
                } else {
                    renderMonthNameday(m, null, true);
                }
            }, 4000);
        }
    }

    function createCalendar() {
        const calendar = document.getElementById('calendar');
        const today = new Date();
        const currentYear = today.getFullYear();
        const currentMonth = today.getMonth();
        const currentDay = today.getDate();

        for (let m = 0; m < 12; m++) {
            const isThisMonth = (currentYear === 2026 && m === currentMonth);
            const mDiv = document.createElement('div');
            mDiv.className = `month ${isThisMonth ? 'current-month-box' : ''}`;
            mDiv.id = `month-${m}`;

            const badgeHtml = isThisMonth ? `<span class="current-badge">Τρέχων Μήνας</span>` : '';
            mDiv.innerHTML = `
                <div class="month-header">
                    <span>${monthNames[m]} 2026</span>
                    ${badgeHtml}
                </div>
            `;
            
            const grid = document.createElement('div');
            grid.className = 'days-grid';
            dayNames.forEach(dn => grid.innerHTML += `<div class="day-header">${dn}</div>`);
            
            const first = new Date(2026, m, 1).getDay();
            const daysInM = new Date(2026, m + 1, 0).getDate();
            const start = first === 0 ? 6 : first - 1;

            for (let i = 0; i < start; i++) {
                grid.innerHTML += '<div class="day empty"></div>';
            }
            
            let monthHolidays = [];

            for (let day = 1; day <= daysInM; day++) {
                const isToday = (isThisMonth && currentDay === day);
                const isSunday = new Date(2026, m, day).getDay() === 0;
                const dKey = `${m + 1}-${day}`;
                const hasNames = !!namedays[dKey];
                
                let hClass = "";
                if (holidays[dKey]) {
                    hClass = "holiday-bg";
                    monthHolidays.push(`${day}: ${holidays[dKey]}`);
                }

                const dayEl = document.createElement('div');
                dayEl.className = `day ${isToday ? 'today' : ''} ${isSunday ? 'sunday' : ''} ${hClass} ${hasNames ? 'has-nameday' : ''}`;
                dayEl.textContent = day;
                
                dayEl.addEventListener('click', () => {
                    const parentMonth = document.getElementById(`month-${m}`);
                    parentMonth.querySelectorAll('.day.selected').forEach(el => el.classList.remove('selected'));
                    dayEl.classList.add('selected');
                    renderMonthNameday(m, day, false);
                });

                grid.appendChild(dayEl);
            }
            mDiv.appendChild(grid);

            // Πλαίσιο Εορταζόντων Μήνα
            const namedayBox = document.createElement('div');
            namedayBox.className = 'month-info-banner';
            namedayBox.id = `nameday-box-${m}`;
            mDiv.appendChild(namedayBox);

            // Banner Αργιών Μήνα
            if (monthHolidays.length > 0) {
                const hBanner = document.createElement('div');
                hBanner.className = 'month-holiday-banner';
                monthHolidays.forEach(h => {
                    hBanner.innerHTML += `<div class="holiday-item">🚩 ${h}</div>`;
                });
                mDiv.appendChild(hBanner);
            }

            calendar.appendChild(mDiv);

            // Αρχική κατάσταση εορτών
            if (isThisMonth) {
                renderMonthNameday(m, currentDay, true);
            } else {
                renderMonthNameday(m, null, true);
            }
        }

        // Αυτόματη μεταφορά στον τρέχοντα μήνα
        const targetMonthEl = document.getElementById(`month-${currentMonth}`);
        if (targetMonthEl) {
            setTimeout(() => {
                targetMonthEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 150);
        }
    }

    createCalendar();
</script>
</body>
</html>

<html lang="el">
<head>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #121224; color: #f0f0f5; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        
        /* Πλαίσιο επιλεγμένης / σημερινής ημέρας */
        .today-box {
            background: linear-gradient(135deg, #3a1c71 0%, #d76d77 50%, #ffaf7b 100%);
            padding: 22px 25px;
            border-radius: 18px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        .today-date { font-size: 1.8em; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .celebrating-now {
            font-size: 1.1em;
            background: rgba(18, 18, 36, 0.75);
            backdrop-filter: blur(8px);
            padding: 12px 24px;
            border-radius: 12px;
            color: #4ecdc4;
            display: inline-block;
            margin-top: 12px;
            border: 1px solid rgba(78, 205, 196, 0.4);
            max-width: 90%;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .holiday-tag {
            display: inline-block;
            background: #ff6b6b;
            color: white;
            font-weight: bold;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.85em;
            margin-left: 8px;
            vertical-align: middle;
        }

        /* Grid Μηνών */
        .months-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
            gap: 22px;
        }
        .month { 
            background: #1a1a2e; 
            border-radius: 16px; 
            padding: 16px; 
            border: 1px solid #2e2e4a; 
            display: flex; 
            flex-direction: column;
            scroll-margin-top: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .month.current-month-box {
            border: 2px solid #4ecdc4;
            box-shadow: 0 0 18px rgba(78, 205, 196, 0.25);
        }
        .month-header { 
            text-align: center; 
            font-weight: 700; 
            font-size: 1.25em; 
            margin-bottom: 12px; 
            color: #ffd700; 
        }
        .days-grid { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            gap: 4px; 
            margin-bottom: 12px; 
        }
        .day-header { 
            font-size: 0.8em; 
            font-weight: 600;
            text-align: center; 
            color: #8c8ca1; 
            padding-bottom: 6px; 
        }
        .day { 
            aspect-ratio: 1; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            font-size: 0.88em; 
            border-radius: 8px; 
            background: #252540; 
            cursor: pointer;
            position: relative;
            user-select: none;
            transition: transform 0.15s ease, background 0.15s ease;
        }
        .day:hover {
            transform: scale(1.08);
            background: #36365a;
            z-index: 2;
        }
        .day.selected {
            outline: 2px solid #ffd700;
        }
        .day.today { 
            background: #ffd700 !important; 
            color: #121224 !important; 
            font-weight: 800; 
            border: 2px solid #ffffff; 
        }
        .day.holiday-bg { 
            background: #ff5252; 
            color: white; 
            font-weight: 700; 
        }
        .day.sunday { 
            color: #ff8a8a; 
        }
        .day.has-nameday::after {
            content: '';
            width: 4px;
            height: 4px;
            background: #4ecdc4;
            border-radius: 50%;
            position: absolute;
            bottom: 3px;
        }
        .day.today.has-nameday::after {
            background: #121224;
        }
        .empty { 
            background: transparent; 
            cursor: default; 
        }
        .empty:hover {
            transform: none;
            background: transparent;
        }

        /* Banner Αργιών */
        .month-holiday-banner {
            margin-top: auto;
            background: rgba(255, 107, 107, 0.12);
            border-left: 3px solid #ff6b6b;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.82em;
            color: #ff9e9e;
        }
        .holiday-item { margin: 2px 0; font-weight: 500; }
    </style>
</head>

        '12-21': 'Θεμιστοκλής, Θέμης, Ιουλία, Ιουλιανή, Γιούλη, Τζούλια',
        '12-22': 'Αναστασία, Νατάσα, Τασία, Σία',
        '12-23': 'Νήφων',
        '12-24': 'Ευγενία, Τζένη',
        '12-25': 'Χρήστος, Χρίστος, Χριστίνα, Χριστιάνα, Εμμανουήλ, Μανώλης, Μανουέλα, Χρύσα, Χρυσή',
        '12-26': 'Εμμανουήλ, Μανώλης, Μανώλα, Κωνστάντιος, Κωνσταντία',
        '12-27': 'Στέφανος, Στεφανία, Στέφη, Μαυρίκιος',
        '12-28': 'Θεόφιλος, Θεοφίλη, Δόμνα',
        '12-29': 'Βενιαμίν',
        '12-30': 'Ανυσία, Γεδεών',
        '12-31': 'Μελανία, Μέλανη'
    };

    const monthNames = ['Ιανουάριος', 'Φεβρουάριος', 'Μάρτιος', 'Απρίλιος', 'Μάιος', 'Ιούνιος', 'Ιούλιος', 'Αύγουστος', 'Σεπτέμβριος', 'Οκτώβριος', 'Νοέμβριος', 'Δεκέμβριος'];
    const dayNames = ['Δε', 'Τρ', 'Τε', 'Πε', 'Πα', 'Σα', 'Κυ'];
    const dayNamesFull = ['Κυριακή', 'Δευτέρα', 'Τρίτη', 'Τετάρτη', 'Πέμπτη', 'Παρασκευή', 'Σάββατο'];

    function showDateInfo(year, month, day) {
        const dateObj = new Date(year, month, day);
        const dayOfWeek = dayNamesFull[dateObj.getDay()];
        const key = `${month + 1}-${day}`;

        document.getElementById('currentDate').textContent = `${dayOfWeek}, ${day} ${monthNames[month]} ${year}`;
        
        const celebrateDiv = document.getElementById('celebration');
        const name = namedays[key];
        const holiday = holidays[key];

        let content = '';
        if (holiday) {
            content += `<span class="holiday-tag">🚩 ${holiday}</span> `;
        }
        if (name) {
            content += `🎉 Γιορτάζουν: <strong>${name}</strong>`;
        } else if (!holiday) {
            content = "Δεν υπάρχει κάποια γνωστή γιορτή";
        }

        celebrateDiv.innerHTML = content;
    }

    function createCalendar() {
        const calendar = document.getElementById('calendar');
        const today = new Date();
        const currentYear = today.getFullYear();
        const currentMonth = today.getMonth();
        const currentDay = today.getDate();

        for (let m = 0; m < 12; m++) {
            const isThisMonth = (currentYear === 2026 && m === currentMonth);
            const mDiv = document.createElement('div');
            mDiv.className = `month ${isThisMonth ? 'current-month-box' : ''}`;
            mDiv.id = `month-${m}`;
            mDiv.innerHTML = `<div class="month-header">${monthNames[m]} 2026</div>`;
            
            const grid = document.createElement('div');
            grid.className = 'days-grid';
            dayNames.forEach(dn => grid.innerHTML += `<div class="day-header">${dn}</div>`);
            
            const first = new Date(2026, m, 1).getDay();
            const daysInM = new Date(2026, m + 1, 0).getDate();
            const start = first === 0 ? 6 : first - 1;

            for (let i = 0; i < start; i++) {
                grid.innerHTML += '<div class="day empty"></div>';
            }
            
            let monthHolidays = [];

            for (let day = 1; day <= daysInM; day++) {
                const isToday = (isThisMonth && currentDay === day);
                const isSunday = new Date(2026, m, day).getDay() === 0;
                const dKey = `${m + 1}-${day}`;
                const hasNames = !!namedays[dKey];
                
                let hClass = "";
                if (holidays[dKey]) {
                    hClass = "holiday-bg";
                    monthHolidays.push(`${day}: ${holidays[dKey]}`);
                }

                const dayEl = document.createElement('div');
                dayEl.className = `day ${isToday ? 'today' : ''} ${isSunday ? 'sunday' : ''} ${hClass} ${hasNames ? 'has-nameday' : ''}`;
                dayEl.textContent = day;
                
                // Δυνατότητα κλικ σε κάθε ημέρα
                dayEl.addEventListener('click', () => {
                    document.querySelectorAll('.day.selected').forEach(el => el.classList.remove('selected'));
                    dayEl.classList.add('selected');
                    showDateInfo(2026, m, day);
                });

                grid.appendChild(dayEl);
            }
            mDiv.appendChild(grid);

            if (monthHolidays.length > 0) {
                const hBanner = document.createElement('div');
                hBanner.className = 'month-holiday-banner';
                monthHolidays.forEach(h => {
                    hBanner.innerHTML += `<div class="holiday-item">🚩 ${h}</div>`;
                });
                mDiv.appendChild(hBanner);
            }

            calendar.appendChild(mDiv);
        }

        // Αρχική εμφάνιση σημερινής ημέρας
        showDateInfo(2026, currentMonth, currentDay);

        // Αυτόματο scroll στον τρέχοντα μήνα κατά το άνοιγμα
        const targetMonthEl = document.getElementById(`month-${currentMonth}`);
        if (targetMonthEl) {
            setTimeout(() => {
                targetMonthEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 150);
        }
    }

    createCalendar();
</script>
</body>
</html>
